<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ver Reservas - Hotel Leyton</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="ver_reservas.html">Reservas</a></li>
          <li class="nav-item"><a class="nav-link" href="crear_reserva.html">Nueva Reserva</a></li>
          <li class="nav-item"><a class="nav-link" href="disponibilidad.html">Disponibilidad</a></li>
          <!-- Agrega aquí los links de habitaciones, usuarios, pagos y servicios cuando estén listos -->
        </ul>
      </div>
      <a class="navbar-brand fw-bold fs-4 ms-auto" href="index.html">🏨 Leyton</a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h3 class="card-title mb-0">Lista de Reservas</h3>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark text-center">
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Habitación</th>
                <th>Entrada</th>
                <th>Salida</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="reservas-table-body"></tbody>
          </table>
        </div>
        <div class="text-center mt-3">
          <a href="crear_reserva.html" class="btn btn-success">Nueva Reserva</a>
          <a href="disponibilidad.html" class="btn btn-info text-white">Buscar Disponibilidad</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function cargarReservas() {
      fetch('http://localhost:3000/api/reservas')
        .then(response => response.json())
        .then(data => {
          const tableBody = document.getElementById('reservas-table-body');
          tableBody.innerHTML = '';
          data.forEach(reserva => {
            const row = document.createElement('tr');
            const entrada = reserva.fechaEntrada ? reserva.fechaEntrada.split('T')[0] : '';
            const salida = reserva.fechaSalida ? reserva.fechaSalida.split('T')[0] : '';

            row.innerHTML = `
              <td class="text-center">${reserva.idReserva}</td>
              <td>${reserva.cliente}</td>
              <td class="text-center">Hab. ${reserva.numeroHabitacion}</td>
              <td class="text-center">${entrada}</td>
              <td class="text-center">${salida}</td>
              <td class="text-end">$${parseFloat(reserva.precioTotal).toLocaleString('es-CO')}</td>
              <td class="text-center"><span class="badge bg-${badgeColor(reserva.estado)}">${reserva.estado}</span></td>
              <td class="text-center">
                ${reserva.estado !== 'Cancelada'
                  ? `<button class="btn btn-danger btn-sm" onclick="cancelar(${reserva.idReserva})">Cancelar</button>`
                  : '<span class="text-muted">N/A</span>'}
              </td>
            `;
            tableBody.appendChild(row);
          });
        })
        .catch(error => console.error('Error al cargar reservas:', error));
    }

    function cancelar(idReserva) {
      if (confirm(`¿Estás seguro de cancelar la reserva #${idReserva}?`)) {
        fetch(`http://localhost:3000/api/reservas/${idReserva}/cancelar`, {
          method: 'PUT'
        })
          .then(res => res.json())
          .then(() => cargarReservas())
          .catch(err => console.error('Error al cancelar:', err));
      }
    }

    function badgeColor(estado) {
      switch (estado) {
        case 'Confirmada': return 'success';
        case 'Pendiente': return 'warning';
        case 'Cancelada': return 'secondary';
        default: return 'info';
      }
    }

    cargarReservas();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
