<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ver Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center mb-4">Lista de Reservas</h2>
    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark text-center">
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Habitación</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="reservas-table-body"></tbody>
      </table>
    </div>
    <div class="text-center mt-4">
      <a href="crear_reserva.html" class="btn btn-success">Nueva Reserva</a>
      <a href="disponibilidad.html" class="btn btn-info text-white">Buscar Disponibilidad</a>
      <a href="index.html" class="btn btn-secondary">Volver</a>
    </div>
  </div>

  <script>
    function cargarReservas() {
      fetch('http://localhost:3000/api/reservas')
        .then(response => response.json())
        .then(data => {
          const tableBody = document.getElementById('reservas-table-body');
          tableBody.innerHTML = '';
          data.forEach(reserva => {
            const row = document.createElement('tr');
            const entrada = reserva.fechaEntrada ? reserva.fechaEntrada.split('T')[0] : '';
            const salida = reserva.fechaSalida ? reserva.fechaSalida.split('T')[0] : '';
            
            row.innerHTML = `
              <td class="text-center">${reserva.idReserva}</td>
              <td>${reserva.cliente}</td>
              <td class="text-center">Hab. ${reserva.numeroHabitacion}</td>
              <td class="text-center">${entrada}</td>
              <td class="text-center">${salida}</td>
              <td class="text-end">$${parseFloat(reserva.precioTotal).toLocaleString('es-CO')}</td>
              <td class="text-center"><span class="badge bg-${badgeColor(reserva.estado)}">${reserva.estado}</span></td>
              <td class="text-center">
                ${reserva.estado !== 'Cancelada' 
                  ? `<button class="btn btn-danger btn-sm" onclick="cancelar(${reserva.idReserva})">Cancelar</button>` 
                  : '<span class="text-muted">N/A</span>'}
              </td>
            `;
            tableBody.appendChild(row);
          });
        })
        .catch(error => console.error('Error al cargar reservas:', error));
    }

    function cancelar(idReserva) {
      if (confirm(`¿Estás seguro de cancelar la reserva #${idReserva}?`)) {
        fetch(`http://localhost:3000/api/reservas/${idReserva}/cancelar`, {
          method: 'PUT'
        })
        .then(res => res.json())
        .then(() => cargarReservas())
        .catch(err => console.error('Error al cancelar:', err));
      }
    }

    function badgeColor(estado) {
      switch(estado) {
        case 'Confirmada': return 'success';
        case 'Pendiente': return 'warning';
        case 'Cancelada': return 'secondary';
        default: return 'info';
      }
    }

    cargarReservas();
  </script>
</body>
</html>
