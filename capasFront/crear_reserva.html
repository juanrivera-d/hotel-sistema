<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nueva Reserva</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Crear Nueva Reserva</h2>
    <p class="text-muted text-center">
      Por ahora usamos ID numérico para usuario y habitación (aún no están listos los endpoints
      de Santiago y Javier). Más adelante estos campos se reemplazan por listas desplegables.
    </p>
    <form id="reserva-form">
      <div class="mb-3">
        <label for="idUsuario" class="form-label">ID del huésped (usa 1, 2 o 3 de los datos de prueba)</label>
        <input type="number" class="form-control" id="idUsuario" required />
      </div>
      <div class="mb-3">
        <label for="idHabitacion" class="form-label">ID de la habitación (usa 1, 2 o 3 de los datos de prueba)</label>
        <input type="number" class="form-control" id="idHabitacion" required />
      </div>
      <div class="mb-3">
        <label for="fechaEntrada" class="form-label">Fecha de entrada</label>
        <input type="date" class="form-control" id="fechaEntrada" required />
      </div>
      <div class="mb-3">
        <label for="fechaSalida" class="form-label">Fecha de salida</label>
        <input type="date" class="form-control" id="fechaSalida" required />
      </div>
      <div class="mb-3">
        <label for="precioTotal" class="form-label">Precio total</label>
        <input type="number" class="form-control" id="precioTotal" required />
      </div>
      <button type="submit" class="btn btn-success">Reservar</button>
      <a href="ver_reservas.html" class="btn btn-secondary ms-2">Volver</a>
    </form>
    <div id="mensaje" class="alert mt-4 d-none"></div>
  </div>

  <script>
    document.getElementById('reserva-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const idUsuario = document.getElementById('idUsuario').value;
      const idHabitacion = document.getElementById('idHabitacion').value;
      const fechaEntrada = document.getElementById('fechaEntrada').value;
      const fechaSalida = document.getElementById('fechaSalida').value;
      const precioTotal = document.getElementById('precioTotal').value;

      fetch('http://localhost:3000/api/reservas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fechaEntrada, fechaSalida, precioTotal, idUsuario, idHabitacion })
      })
        .then(response => response.json())
        .then(data => {
          const mensaje = document.getElementById('mensaje');
          mensaje.classList.remove('d-none', 'alert-danger');
          mensaje.classList.add('alert', 'alert-success');
          mensaje.textContent = 'Reserva creada con éxito';
          document.getElementById('reserva-form').reset();
        })
        .catch(error => {
          const mensaje = document.getElementById('mensaje');
          mensaje.classList.remove('d-none', 'alert-success');
          mensaje.classList.add('alert', 'alert-danger');
          mensaje.textContent = 'Error al crear la reserva';
        });
    });
  </script>
</body>
</html>
